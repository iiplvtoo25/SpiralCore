<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Overview of task progress and deadlines.">
<meta name="author" content="Your Name">
<meta name="keywords" content="task manager, dashboard, IMS566, Bootstrap 5">
<title>Dashboard | Spiral Core</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <h1 class="page-title h2 mb-4">Dashboard</h1>
  <section class="row g-3 mb-4" aria-label="Summary">
    <div class="col-6 col-lg-3"><div class="tf-card stat"><div class="num" id="sTotal"></div><small>Total tasks</small></div></div>
    <div class="col-6 col-lg-3"><div class="tf-card stat"><div class="num" id="sDone"></div><small>Completed</small></div></div>
    <div class="col-6 col-lg-3"><div class="tf-card stat amber"><div class="num" id="sProg"></div><small>In progress</small></div></div>
    <div class="col-6 col-lg-3"><div class="tf-card stat amber"><div class="num" id="sRate"></div><small>Completion rate</small></div></div>
  </section>
  <section class="row g-3">
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Tasks by status</h2><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div>
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Workload per member</h2><div class="chart-box"><canvas id="ownerChart"></canvas></div></div></div>
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Next deadlines</h2><ul class="list-group list-group-flush" id="upcoming"></ul></div></div>
  </section>
  <section class="row g-3 mt-1">
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Tasks by priority</h2><div class="chart-box"><canvas id="priorityChart"></canvas></div></div></div>
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Status per member</h2><div class="chart-box"><canvas id="memberStatusChart"></canvas></div></div></div>
    <div class="col-lg-4"><div class="tf-card"><h2 class="h5">Deadlines per week</h2><div class="chart-box"><canvas id="weekChart"></canvas></div></div></div>
  </section>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/dashboard.js"></script></body></html>
