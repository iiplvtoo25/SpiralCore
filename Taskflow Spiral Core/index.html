<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in to Spiral Core, a simple team task manager.">
<meta name="author" content="Your Name">
<meta name="keywords" content="task manager, dashboard, IMS566, Bootstrap 5">
<title>Login | Spiral Core</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <section class="login-side">
    <h1>Spiral <span>Core</span></h1>
    <p class="lead">Plan work, track progress and keep your team on schedule.</p>
  </section>
  <main class="login-form">
    <div class="tf-card">
      <h2 class="h4 mb-3">Sign in</h2>
      <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
      <form id="loginForm" novalidate>
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control mb-3" autocomplete="username">
        <label for="password" class="form-label">Password</label>
        <div class="input-group mb-3">
          <input id="password" type="password" class="form-control" autocomplete="current-password">
          <button type="button" id="togglePw" class="btn btn-outline-secondary">Show</button>
        </div>
        <button class="btn btn-tf w-100">Sign in</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Demo login: <strong>admin</strong> / <strong>1234</strong></p>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script></body></html>
