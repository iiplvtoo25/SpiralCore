<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Searchable list of all project tasks.">
<meta name="author" content="Your Name">
<meta name="keywords" content="task manager, dashboard, IMS566, Bootstrap 5">
<title>Tasks | Spiral Core</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <h1 class="page-title h2 mb-3">Tasks</h1>
  <div class="row g-2 mb-3">
    <div class="col-md-8"><input id="search" class="form-control" placeholder="Search tasks by title" aria-label="Search tasks"></div>
    <div class="col-md-4"><select id="filter" class="form-select" aria-label="Filter by status">
      <option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Done</option></select></div>
  </div>
  <div class="tf-card p-0 table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>#</th><th>Task</th><th>Owner</th><th>Priority</th><th>Status</th><th>Due date</th></tr></thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/tasks.js"></script></body></html>
